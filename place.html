<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="author" content="Somto Unachukwu">
    <meta name="description" content=" - A snapshot of Nigeria: key facts and current weather in the capital.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria</title>
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=cloud" />
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <span class="logo" aria-hidden="true">🏔️</span>
        <h1>Nigeria</h1>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Lush river landscape representative of Nigeria's varied terrain"
                    width="500" height="250">
            </picture>

            <div class="card data-card">
                <h2>Data</h2>
                <dl>
                    <div class="row">
                        <dt>Capital:</dt>
                        <dd>Abuja</dd>
                    </div>
                    <div class="row">
                        <dt>Population:</dt>
                        <dd>~223 million</dd>
                    </div>
                    <div class="row">
                        <dt>Language:</dt>
                        <dd>English (official)</dd>
                    </div>
                    <div class="row">
                        <dt>Currency:</dt>
                        <dd>Naira (₦)</dd>
                    </div>
                    <div class="row">
                        <dt>Area:</dt>
                        <dd>923,768 km²</dd>
                    </div>
                    <div class="row">
                        <dt>Independence:</dt>
                        <dd>Oct 1, 1960</dd>
                    </div>
                </dl>
            </div>

            <div class="card weather-card">
                <h2>Weather</h2>
                <span class="material-symbols-outlined weather-icon" aria-hidden="true">cloud</span>
                <dl>
                    <div class="row">
                        <dt>Temp:</dt>
                        <dd>86°F</dd>
                    </div>
                    <div class="row">
                        <dt>Condition:</dt>
                        <dd>Sunny</dd>
                    </div>
                    <div class="row">
                        <dt>Humidity:</dt>
                        <dd>55%</dd>
                    </div>
                    <div class="row">
                        <dt>Wind:</dt>
                        <dd>5 mph SW</dd>
                    </div>
                </dl>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Somto Unachukwu | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
