<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="author" content="Somto Unachukwu">
    <meta name="description" content=" - A snapshot of Nigeria: key facts and current weather in the capital.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria</title>
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <span class="logo" aria-hidden="true">🏔️</span>
        <h1>Nigeria</h1>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Lush river landscape representative of Nigeria's varied terrain"
                    width="500" height="250">
            </picture>

            <div class="card data-card">
                <h2>Data</h2>
                <dl>
                    <div class="row">
                        <dt>Capital:</dt>
                        <dd>Abuja</dd>
                    </div>
                    <div class="row">
                        <dt>Population:</dt>
                        <dd>~223 million</dd>
                    </div>
                    <div class="row">
                        <dt>Language:</dt>
                        <dd>English (official)</dd>
                    </div>
                    <div class="row">
                        <dt>Currency:</dt>
                        <dd>Naira (₦)</dd>
                    </div>
                    <div class="row">
                        <dt>Area:</dt>
                        <dd>923,768 km²</dd>
                    </div>
                    <div class="row">
                        <dt>Independence:</dt>
                        <dd>Oct 1, 1960</dd>
                    </div>
                </dl>
            </div>

            <div class="card weather-card">
                <h2>Weather</h2>
                <svg class="weather-icon" viewBox="0 0 24 24" width="60" height="60" aria-hidden="true"
                    fill="currentColor">
                    <path
                        d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" />
                </svg>
                <dl>
                    <div class="row">
                        <dt>Temp:</dt>
                        <dd>86°F</dd>
                    </div>
                    <div class="row">
                        <dt>Condition:</dt>
                        <dd>Sunny</dd>
                    </div>
                    <div class="row">
                        <dt>Humidity:</dt>
                        <dd>55%</dd>
                    </div>
                    <div class="row">
                        <dt>Wind:</dt>
                        <dd>5 mph SW</dd>
                    </div>
                    <div class="row">
                        <dt>Wind Chill:</dt>
                        <dd id="windchill"></dd>
                    </div>
                </dl>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Somto Unachukwu | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
