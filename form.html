<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="Submit a review for a product you've purchased and share your experience in detail.">
    <meta name="author" content="Somto Unachukwu">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
        <p class="tagline">Tell us what you think — it only takes a minute.</p>
    </header>

    <main>
        <form action="review.html" method="get">

            <div class="field">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>

                </select>
            </div>

            <fieldset class="field rating-field">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <input type="radio" id="rating-5" name="rating" value="5" required>
                    <label for="rating-5" title="5 stars">&star;</label>

                    <input type="radio" id="rating-4" name="rating" value="4" required>
                    <label for="rating-4" title="4 stars">&star;</label>

                    <input type="radio" id="rating-3" name="rating" value="3" required>
                    <label for="rating-3" title="3 stars">&star;</label>

                    <input type="radio" id="rating-2" name="rating" value="2" required>
                    <label for="rating-2" title="2 stars">&star;</label>

                    <input type="radio" id="rating-1" name="rating" value="1" required>
                    <label for="rating-1" title="1 star">&star;</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="field">
                <legend>Useful Features <span class="hint">(check all that apply)</span></legend>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-install" name="features" value="easy-installation">
                        <label for="feature-install">Easy Installation</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-value" name="features" value="great-value">
                        <label for="feature-value">Great Value</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-durable" name="features" value="durable">
                        <label for="feature-durable">Durable</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-advertised" name="features" value="works-as-advertised">
                        <label for="feature-advertised">Works as Advertised</label>
                    </div>
                </div>
            </fieldset>

            <div class="field">
                <label for="review">Written Review <span class="hint">(optional)</span></label>
                <textarea id="review" name="review" rows="5"
                    placeholder="Share your experience with this product..."></textarea>
            </div>

            <div class="field">
                <label for="username">Your Name <span class="hint">(optional)</span></label>
                <input type="text" id="username" name="username" placeholder="Jane Doe">
            </div>

            <div class="field submit-field">
                <input type="submit" value="Submit Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Somto Unachukwu | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
