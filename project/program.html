<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Somto Unachukwu">
    <meta name="description" content="Browse swim programs for beginners, young competitors, adults and water safety.">
    <title>Programs | DE-IYKE Swimming Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js" defer></script>
</head>

<body>
    <header>
        <a class="brand" href="index.html">
            <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
                <circle cx="36" cy="36" r="34" fill="#1FA2C9" stroke="#fff" stroke-width="3" />
                <path d="M10 30 q8-8 16 0 t16 0 t16 0 M10 42 q8-8 16 0 t16 0 t16 0 M10 54 q8-8 16 0 t16 0 t16 0"
                    fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
                <circle cx="48" cy="18" r="6" fill="#F26B3A" />
            </svg>
            <span>DE-IYKE Swimming Club</span>
        </a>
        <button id="menu" class="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false"
            aria-controls="site-nav">&#9776;</button>
        <nav id="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="programs.html" aria-current="page">Programs</a>
            <a href="join.html">Join</a>
        </nav>
    </header>

    <main>
        <h1>Our programs</h1>
        <p>Choose a group to see the programs that fit you best.</p>
        <div class="filters" role="group" aria-label="Filter programs">
            <button type="button" data-group="all" aria-pressed="true">All</button>
            <button type="button" data-group="kids" aria-pressed="false">Children and youth</button>
            <button type="button" data-group="adults" aria-pressed="false">Adults</button>
            <button type="button" data-group="safety" aria-pressed="false">Water safety</button>
        </div>
        <div id="program-list" class="grid" aria-live="polite"></div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Somto Unachukwu | DE-IYKE Swimming Club | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
